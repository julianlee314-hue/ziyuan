<!DOCTYPE html>
<html lang="zh-Hant-TW" data-lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="doc.title">字園 Zìyuán — 台灣華語字圃</title>
  <script>
    (function () {
      try {
        var l = localStorage.getItem("ziyuan-lang");
        if (l !== "en" && l !== "zh") l = "zh";
        document.documentElement.setAttribute("data-lang", l);
        document.documentElement.lang = l === "en" ? "en" : "zh-Hant-TW";
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=plot3-3600-20261001" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="first-plot.html" title="First plot" style="text-decoration:none;color:inherit">
        <b>字園</b>
        <span data-i18n="brand.sub">ZÌYUÁN / 字圃</span>
      </a>
      <nav class="nav">
        <button data-view="garden" data-i18n="nav.garden">園</button>
        <button data-view="nursery" class="active" data-i18n="nav.nursery">苗圃</button>
        <button data-view="profile" data-i18n="nav.profile">字檔</button>
        <button data-view="water" data-i18n="nav.water">澆水</button>
        <button data-view="lesson" data-i18n="nav.lesson">課床</button>
        <a href="first-plot.html" class="iconbtn" style="text-decoration:none" data-i18n="nav.preface">前言</a>
      </nav>
      <div class="search">
        <input id="q" data-i18n-placeholder="search.ph" placeholder="搜 字 / 注音 / 拼音 / English / 台灣" />
      </div>
      <div class="clockbox">
        <span id="demo-flag">示範鐘</span>
        <label class="chk"><input type="checkbox" id="demo-toggle" checked /> <span data-i18n="demo.accel">加速</span></label>
        <select id="demo-rate">
          <option value="0.5" data-i18n="demo.rate.0.5">0.5 時/秒</option>
          <option value="2" selected data-i18n="demo.rate.2">2 時/秒</option>
          <option value="12" data-i18n="demo.rate.12">12 時/秒</option>
          <option value="72" data-i18n="demo.rate.72">3 日/秒</option>
        </select>
      </div>
    </header>
    <main>
      <section class="view" data-view="garden">
        <div class="hero"><div><h1 data-i18n="garden.h1">園</h1><p data-i18n="garden.lead">每一個字是一株植物。澆水是提取練習，不是重讀。</p></div>
        <div class="stats">
          <div class="stat"><b id="g-planted">0</b><span data-i18n="stat.planted">已播</span></div>
          <div class="stat"><b id="g-due">0</b><span data-i18n="stat.due">待澆</span></div>
          <div class="stat"><b id="g-bloom">0</b><span data-i18n="stat.bloom">盛開</span></div>
          <div class="stat"><b id="g-wilt">0</b><span data-i18n="stat.wilt">萎／枯</span></div>
        </div></div>
        <div class="actions">
          <button class="btn" id="water-all" data-i18n="btn.waterAll">澆所有到期</button>
          <button class="btn ghost" id="clear-garden" data-i18n="btn.clearGarden">清空本機園</button>
        </div>
        <div class="pots" id="garden-pots"></div>
      </section>
      <section class="view on" data-view="nursery">
        <div class="hero"><div><h1 data-i18n="nursery.h1">苗圃</h1><p data-i18n="nursery.lead">5 × 1200＝6000 個不重複的字。一圃 市井、二圃、三圃已上架，各 1200 字；四～五圃尚空。</p></div>
        <div class="stat"><b id="n-count">0</b><span data-i18n="stat.seeds">可見種子</span></div></div>
        <div class="beds">
          <button data-lv="1" class="on" data-i18n="bed.1">一圃 市井</button>
          <button data-lv="2" data-i18n="bed.2">二圃</button>
          <button data-lv="3" data-i18n="bed.3">三圃</button>
          <button data-lv="4" data-i18n="bed.4">四圃</button>
          <button data-lv="5" data-i18n="bed.5">五圃</button>
          <button data-lv="0" data-i18n="bed.all">全開</button>
        </div>
        <div class="settings-row">
          <label class="chk"><input type="checkbox" id="adult-toggle" /> <span data-i18n="set.adult">成人 mem</span></label>
          <label class="chk"><input type="checkbox" id="pinyin-toggle" /> <span data-i18n="set.pinyin">顯示拼音</span></label>
        </div>
        <div class="catalog-grid" id="catalog-grid"></div>
      </section>
      <section class="view" data-view="profile">
        <div class="lookup">
          <div class="lookup-bar">
            <div><div class="kicker" data-i18n="lookup.kicker">字典</div><h1 class="lookup-title" data-i18n="lookup.title">Lookup</h1></div>
            <label class="chk rich-toggle"><input type="checkbox" id="rich-toggle" /> <span data-i18n="set.rich">Full pot</span></label>
          </div>
          <div class="flip-wrap" id="flip-wrap">
            <div class="flip-card" id="flip-card">
              <div class="flip-face flip-front">
                <div class="tian replay" id="tian"><div class="big" id="p-glyph">字</div></div>
                <div class="lookup-zy" id="p-zy">ㄧˋ</div>
              </div>
              <div class="flip-face flip-back">
                <div class="en-card"><div class="kicker">English</div><p id="p-en-short">—</p></div>
              </div>
            </div>
          </div>
          <div class="lookup-actions">
            <button class="btn" id="btn-flip" data-i18n="btn.flip.en">Flip · English</button>
            <button class="btn ghost" id="btn-speak-f" data-i18n="btn.speak.f">女聲</button>
            <button class="btn ghost" id="btn-speak-m" data-i18n="btn.speak.m">男聲</button>
            <button class="btn ghost" id="btn-replay" data-i18n="btn.replay">重播筆勢</button>
          </div>
        </div>
        <div class="dossier" id="rich-panel" hidden>
          <div class="glyph-stage compact">
            <div class="meta-row">
              <span class="chip lv" id="p-rank">#</span>
              <span class="chip" id="p-stk"></span>
              <span class="chip" id="p-stage"></span>
            </div>
            <div class="actions">
              <button class="btn" id="btn-seed" data-i18n="btn.seed">播進園裡</button>
              <button class="btn ghost" id="btn-tray" data-i18n="btn.tray">加入課床</button>
            </div>
          </div>
          <div class="panel">
            <h2 data-i18n="h2.ledger">Ledger</h2>
            <p class="lead" id="p-hook"></p>
            <div class="meta-row" id="p-stone-chips"></div>
            <p class="lead" id="p-weather"></p>
            <h2 data-i18n="h2.dossier">字檔</h2>
            <p class="lead" id="p-en"></p>
            <p class="lead" id="p-tw" style="display:none"></p>
            <div class="readings" id="p-readings"></div>
            <div class="meta-row"><span id="p-py"></span></div>
            <h2 data-i18n="h2.words">台灣詞束</h2>
            <div class="words" id="p-words"></div>
            <h2 data-i18n="h2.look">形近</h2>
            <div class="meta-row" id="p-look"></div>
            <h2 data-i18n="h2.mem">Mem</h2>
            <div class="mems" id="p-mems"></div>
            <textarea id="new-mem" rows="2" data-i18n-placeholder="mem.ph" placeholder="發明一則"></textarea>
            <div class="actions">
              <label class="chk"><input type="checkbox" id="mem-adult" /> <span data-i18n="mem.adult">成人</span></label>
              <button class="btn" id="btn-add-mem" data-i18n="btn.addMem">選用</button>
            </div>
            <h2 data-i18n="h2.notes">筆記</h2>
            <textarea id="p-notes" rows="3"></textarea>
          </div>
        </div>
      </section>
      <section class="view" data-view="water">
        <div class="hero"><div><h1 data-i18n="water.h1">澆水</h1><p data-i18n="water.lead">只澆到期與枯萎的株。</p></div><div class="stat"><b id="w-due">0</b><span data-i18n="stat.thirsty">渴株</span></div></div>
        <div id="quiz-wrap"></div>
      </section>
      <section class="view" data-view="lesson">
        <div class="hero"><div><h1 data-i18n="lesson.h1">課床</h1><p data-i18n="lesson.lead">現在只是托盤。</p></div><div class="stat"><b id="tray-count">0</b><span data-i18n="stat.onTray">床上的字</span></div></div>
        <div class="tray" id="tray"></div>
        <p class="footer-note" id="lesson-note"></p>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="catalog.js?v=plot3-3600-20261001"></script>
  <script src="i18n.js?v=plot3-3600-20261001"></script>
  <script src="app.js?v=plot3-3600-20261001"></script>
</body>
</html>
